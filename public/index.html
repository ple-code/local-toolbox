<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HTML to PDF</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <h1>HTML to PDF</h1>
          <p class="meta" id="profileMeta">Profile loading</p>
        </div>
        <span class="status-dot" id="serverStatus" aria-label="服务状态"></span>
      </header>

      <section class="workspace" aria-label="导出工具">
        <div class="editor">
          <label for="urls">URLs</label>
          <textarea id="urls" spellcheck="false">https://time.geekbang.org/column/article/999533?screen=full</textarea>
        </div>

        <aside class="panel" aria-label="操作">
          <div class="counter">
            <span id="urlCount">1</span>
            <small>items</small>
          </div>

          <div class="actions">
            <button class="button secondary" id="openBrowser" type="button">
              <span aria-hidden="true">↗</span>
              <span>打开登录窗口</span>
            </button>
            <button class="button secondary" id="autoLogin" type="button">
              <span aria-hidden="true">→</span>
              <span>自动登录</span>
            </button>
            <button class="button primary" id="export" type="button">
              <span aria-hidden="true">⇩</span>
              <span>开始导出</span>
            </button>
            <button class="button ghost" id="clear" type="button">
              <span aria-hidden="true">×</span>
              <span>清空</span>
            </button>
          </div>

          <form class="credentials" id="credentialsForm">
            <div class="field">
              <label for="username">账号</label>
              <input id="username" autocomplete="username" placeholder="手机号或邮箱">
            </div>
            <div class="field">
              <label for="loginUrl">账密登录地址</label>
              <input id="loginUrl" autocomplete="off" placeholder="https://account.geekbang.org/signin">
            </div>
            <div class="field">
              <label for="password">密码</label>
              <input id="password" type="password" autocomplete="current-password" placeholder="保存后不会回显">
            </div>
            <button class="button ghost" id="saveCredentials" type="submit">
              <span aria-hidden="true">▣</span>
              <span>保存账密</span>
            </button>
            <div class="credential-meta" id="credentialMeta">未配置账密</div>
          </form>

          <div class="login-preview" id="loginPreview" hidden>
            <div class="preview-head">
              <span>登录页预览</span>
              <button class="icon-button" id="refreshPreview" type="button" aria-label="刷新登录页截图">↻</button>
            </div>
            <img id="loginScreenshot" alt="远程浏览器登录页截图">
          </div>

          <div class="run-state" id="runState">
            <div class="state-title" id="stateTitle">Ready</div>
            <div class="state-detail" id="stateDetail">单个地址下载 PDF，多个地址下载 ZIP。</div>
          </div>

          <section class="log-panel" aria-label="执行日志">
            <div class="log-head">
              <span>执行日志</span>
              <span class="log-tip">最近 50 条</span>
            </div>
            <div class="log-empty" id="logEmpty">暂无日志</div>
            <div class="log-list" id="logList" aria-live="polite"></div>
          </section>

          <div class="download" id="downloadInfo" hidden>
            <div class="download-label">Latest</div>
            <div class="download-name" id="downloadName"></div>
          </div>
        </aside>
      </section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
